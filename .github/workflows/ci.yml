name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --include=dev
      - run: npm test
      - run: npm run build
        env:
          BOOKING_PDF_SECRET: ci-build-placeholder-not-used-for-mail
      - run: node scripts/service-slug-local-http-selftest.mjs
