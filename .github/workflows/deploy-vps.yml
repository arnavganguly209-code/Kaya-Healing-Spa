# Deploys only this site to the existing Hostinger VPS.
# Required GitHub Actions secrets:
#   VPS_HOST     server IP or hostname
#   VPS_USER     SSH user
#   VPS_SSH_KEY  private key that can log in as that user
# Optional:
#   VPS_PORT     SSH port, defaults to 22
#   ORBIT_PASSKEY       written into the server .env when present
#   RESEND_API_KEY      Resend transactional email (booking confirmations)
#   BOOKING_PDF_SECRET  optional; generated on VPS on first deploy if omitted
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD  optional (not used for booking email)

name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kaya-healing-spa-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Update kaya-healing-spa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORBIT_PASSKEY: ${{ secrets.ORBIT_PASSKEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BOOKING_PDF_SECRET: ${{ secrets.BOOKING_PDF_SECRET }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - name: Pull, build, and restart this app only
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          envs: ORBIT_PASSKEY,RESEND_API_KEY,BOOKING_PDF_SECRET,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASSWORD
          script_stop: true
          script: |
            set -euo pipefail
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ -s "${NVM_DIR}/nvm.sh" ]; then
              # shellcheck disable=SC1091
              . "${NVM_DIR}/nvm.sh"
              nvm use 22 >/dev/null 2>&1 || nvm use default >/dev/null 2>&1 || true
            fi
            export PATH="/usr/local/bin:/usr/bin:${HOME}/.local/bin:${PATH}"

            if ! command -v node >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1; then
              echo "ERROR: node/npm not found in PATH for SSH session."
              exit 1
            fi
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "ERROR: pm2 not found in PATH for SSH session."
              exit 1
            fi

            APP_DIR="/var/www/kaya-healing-spa"
            PM2_APP="kaya-healing-spa"
            APP_PORT="3005"
            NODE_BIN="$(command -v node)"

            cd "${APP_DIR}"
            test "$(pwd)" = "${APP_DIR}"
            mkdir -p public/uploads data
            chmod -R u+rwX public/uploads 2>/dev/null || true

            BACKUP_ROOT="/var/backups/kaya-healing-spa"
            STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
            BACKUP_DIR="${BACKUP_ROOT}/${STAMP}"
            mkdir -p "${BACKUP_DIR}"
            if compgen -G "data/*.json" > /dev/null; then
              cp -a data/*.json "${BACKUP_DIR}/" || true
              echo "Backed up booking data to ${BACKUP_DIR}"
            fi

            echo "Syncing origin/main"
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            write_env_key() {
              file="$1"
              key="$2"
              value="$3"
              touch "$file"
              grep -v "^${key}=" "$file" > "${file}.tmp" || true
              printf '%s=%s\n' "$key" "$value" >> "${file}.tmp"
              mv "${file}.tmp" "$file"
            }

            EXISTING_KEY=""
            if [ -f .env ] && grep -q '^ORBIT_PASSKEY=' .env; then
              EXISTING_KEY="$(grep '^ORBIT_PASSKEY=' .env | tail -n1 | cut -d= -f2-)"
            fi
            ORBIT_KEY="${ORBIT_PASSKEY:-$EXISTING_KEY}"
            if [ -z "${ORBIT_KEY}" ]; then
              ORBIT_KEY="713304977"
            fi
            write_env_key .env ORBIT_PASSKEY "${ORBIT_KEY}"
            write_env_key .env.local ORBIT_PASSKEY "${ORBIT_KEY}"
            write_env_key .env SPA_PUBLIC_URL "https://kayahealingspa.com.np"
            write_env_key .env NEXT_PUBLIC_SITE_URL "https://kayahealingspa.com.np"
            write_env_key .env RESEND_FROM_EMAIL "booking@kayahealingspa.com.np"
            if [ -n "${RESEND_API_KEY:-}" ]; then
              write_env_key .env RESEND_API_KEY "${RESEND_API_KEY}"
              write_env_key .env.local RESEND_API_KEY "${RESEND_API_KEY}"
            fi
            if [ -n "${BOOKING_PDF_SECRET:-}" ]; then
              write_env_key .env BOOKING_PDF_SECRET "${BOOKING_PDF_SECRET}"
              write_env_key .env.local BOOKING_PDF_SECRET "${BOOKING_PDF_SECRET}"
            elif ! grep -q '^BOOKING_PDF_SECRET=' .env 2>/dev/null; then
              GEN="$(openssl rand -base64 32 | tr -d '\n')"
              write_env_key .env BOOKING_PDF_SECRET "${GEN}"
              write_env_key .env.local BOOKING_PDF_SECRET "${GEN}"
              echo "Generated BOOKING_PDF_SECRET on server (not printed)"
            fi
            write_env_key .env SMTP_HOST "${SMTP_HOST:-mail.globalorbitmail.cloud}"
            write_env_key .env SMTP_PORT "${SMTP_PORT:-587}"
            write_env_key .env SMTP_USER "${SMTP_USER:-booking@kayahealingspa.com.np}"
            write_env_key .env SMTP_SECURE "false"
            if [ -n "${SMTP_PASSWORD:-}" ]; then
              write_env_key .env SMTP_PASSWORD "${SMTP_PASSWORD}"
              write_env_key .env.local SMTP_PASSWORD "${SMTP_PASSWORD}"
            else
              echo "WARN: SMTP_PASSWORD GitHub secret not set — SMTP verify will fail until configured"
            fi
            if [ -z "${RESEND_API_KEY:-}" ]; then
              echo "ERROR: RESEND_API_KEY GitHub secret is required for production booking email"
              exit 1
            fi
            echo "Runtime env keys configured (values not logged)"

            echo "Installing dependencies"
            npm ci --include=dev

            echo "Building"
            npm run build
            test -f .next/BUILD_ID

            port_busy() {
              if command -v ss >/dev/null 2>&1; then
                ss -ltn | grep -Eq ":${1}\\b"
              else
                return 1
              fi
            }

            echo "Restarting only ${PM2_APP}"
            pm2 delete "${PM2_APP}" >/dev/null 2>&1 || true
            sleep 1

            if port_busy "${APP_PORT}"; then
              echo "Port ${APP_PORT} is still in use by another process. Leaving it alone."
              APP_PORT=""
              for candidate in 3015 3016 3017 3018 3019 3020; do
                if ! port_busy "${candidate}"; then
                  APP_PORT="${candidate}"
                  echo "Kaya will listen on ${APP_PORT}"
                  break
                fi
              done
              if [ -z "${APP_PORT}" ]; then
                echo "ERROR: no free port for kaya-healing-spa"
                exit 1
              fi
            fi
            NODE_ENV=production PORT="${APP_PORT}" HOSTNAME=0.0.0.0 ORBIT_PASSKEY="${ORBIT_KEY}" \
              pm2 start "${NODE_BIN}" \
              --name "${PM2_APP}" \
              --cwd "${APP_DIR}" \
              -- node_modules/next/dist/bin/next start -H 0.0.0.0 -p "${APP_PORT}"
            pm2 save

            echo "Waiting for local HTTP 200 on ${APP_PORT}"
            local_ok=0
            for i in $(seq 1 30); do
              CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:${APP_PORT}/" || true)"
              echo "local attempt ${i}: ${CODE}"
              if [ "${CODE}" = "200" ]; then
                local_ok=1
                break
              fi
              sleep 2
            done
            if [ "${local_ok}" -ne 1 ]; then
              echo "ERROR: kaya-healing-spa is not serving on ${APP_PORT}"
              pm2 describe "${PM2_APP}" || true
              pm2 logs "${PM2_APP}" --lines 80 --nostream || true
              exit 1
            fi

            echo "Aligning nginx for kaya.theglobalorbit.com and kayahealingspa.com.np"
            chmod +x "${APP_DIR}/scripts/vps-kaya-nginx-fix.sh"
            if ! bash "${APP_DIR}/scripts/vps-kaya-nginx-fix.sh"; then
              sudo bash "${APP_DIR}/scripts/vps-kaya-nginx-fix.sh"
            fi

            echo "Kaya deploy ready on port ${APP_PORT}"

      - name: Verify live site
        run: |
          set -euo pipefail
          sleep 5
          CODE="$(curl -sS -o /tmp/kaya.html -w '%{http_code}' --retry 8 --retry-delay 3 --retry-all-errors https://kaya.theglobalorbit.com || true)"
          echo "public HTTP ${CODE}"
          if [ "${CODE}" != "200" ]; then
            echo "ERROR: https://kaya.theglobalorbit.com returned ${CODE}"
            exit 1
          fi
          if ! grep -qi "Kaya" /tmp/kaya.html; then
            echo "ERROR: homepage HTML did not contain Kaya"
            exit 1
          fi
          ABOUT="$(curl -sS --retry 3 --retry-delay 2 "https://kaya.theglobalorbit.com/about" || true)"
          if ! echo "${ABOUT}" | grep -qi "Brand values"; then
            echo "ERROR: /about page body missing expected content"
            exit 1
          fi
          for path in /sitemap.xml /terms /privacy /manifest.webmanifest /contact /about; do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 "https://kaya.theglobalorbit.com${path}" || true)"
            echo "${path} HTTP ${CODE}"
            if [ "${CODE}" != "200" ]; then
              echo "ERROR: ${path} returned ${CODE}"
              exit 1
            fi
          done
          echo "Live site is serving"
          NP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://kayahealingspa.com.np/ || true)"
          echo "kayahealingspa.com.np HTTP ${NP_CODE}"
          if [ "${NP_CODE}" = "200" ]; then
            echo "Primary .np domain is reachable"
          else
            echo "WARN: kayahealingspa.com.np not HTTP 200 (check Cloudflare A record and SSL)"
          fi
